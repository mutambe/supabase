version: "3.9"

# Stack Docker Swarm para uma instancia self-hosted do Supabase, atras do
# Traefik ja existente na VPS da Songhai (rede "traefik_public", resolver
# "letsencrypt" - mesmo padrao do docker-stack.yml do monorepo songhai).
#
# So o servico "kong" (gateway API) fica exposto publicamente em
# supabase.songhai.cc - ele proprio encaminha para Auth, REST, Realtime,
# Storage e Studio por caminho (/auth/v1, /rest/v1, /realtime/v1,
# /storage/v1, /) usando o kong.yml oficial do Supabase (docker/volumes/api
# neste repositorio). Nao sao precisos subdominios extra
# (api./auth./storage./realtime./meta.supabase.songhai.cc).
#
# PRE-REQUISITO antes do primeiro deploy: os ficheiros de configuracao e
# scripts SQL de arranque do Postgres (kong.yml, kong-entrypoint.sh, *.sql,
# pooler.exs - todos em docker/volumes/ neste mesmo repositorio) tem de
# existir no no indicado por SUPABASE_NODE_HOSTNAME, no caminho
# ${SUPABASE_VOLUMES_PATH}.
#
# Edge Functions nao estao incluidas (fora do ambito inicial); pode
# adicionar-se depois como servico extra sem mudar o resto do stack.
#
# HARDENING (adicionado): healthchecks nos servicos onde a imagem tem
# ferramentas confirmadas (db, studio, auth, storage), update_config e
# rollback_config para rolling deploys mais seguros, e replicas=2 nos
# servicos stateless (kong, rest, auth, storage, studio, meta, imgproxy).
#
# IMPORTANTE: todos os servicos continuam fixos ao mesmo node via
# placement.constraints (os volumes usam bind mounts locais em
# SUPABASE_VOLUMES_PATH). Por isso "replicas" aqui da resiliencia a crash
# de container e deploys sem downtime, mas NAO protege contra falha do
# node em si. Para HA multi-node real seria preciso storage partilhado
# (NFS/GlusterFS) ou um Postgres gerido externamente.

networks:
  traefik_public:
    external: true
  supabase_internal:
    driver: overlay

volumes:
  supabase_db_config:

services:
  studio:
    image: supabase/studio:2026.07.07-sha-a6a04f2
    networks:
      - supabase_internal
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
    volumes:
      - ${SUPABASE_VOLUMES_PATH}/snippets:/app/snippets
      - ${SUPABASE_VOLUMES_PATH}/functions:/app/edge-functions:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://studio:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(String(r.status))})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.hostname == ${SUPABASE_NODE_HOSTNAME}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first

  kong:
    image: kong/kong:3.9.1
    networks:
      - traefik_public
      - supabase_internal
    volumes:
      - ${SUPABASE_VOLUMES_PATH}/api/kong.yml:/home/kong/temp.yml:ro
      - ${SUPABASE_VOLUMES_PATH}/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.hostname == ${SUPABASE_NODE_HOSTNAME}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_public
        - traefik.http.routers.supabase.rule=Host(`supabase.songhai.cc`)
        - traefik.http.routers.supabase.entrypoints=websecure
        - traefik.http.routers.supabase.tls.certresolver=letsencrypt
        - traefik.http.services.supabase.loadbalancer.server.port=8000

  auth:
    image: supabase/gotrue:v2.189.0
    networks:
      - supabase_internal
    depends_on:
      - db
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.hostname == ${SUPABASE_NODE_HOSTNAME}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first

  rest:
    image: postgrest/postgrest:v14.12
    networks:
      - supabase_internal
    depends_on:
      - db
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]
    # Nota: a imagem oficial do PostgREST e um binario estatico minimalista
    # (sem wget/curl/shell utils), por isso nao incluimos healthcheck aqui
    # para evitar falsos "unhealthy". O endpoint admin (porta 3001) expoe
    # /ready e /live, que podem ser usados por um sidecar ou pelo Kong.
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.hostname == ${SUPABASE_NODE_HOSTNAME}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first

  realtime:
    # O kong.yml oficial encaminha para "realtime-dev.supabase-realtime:4000"
    # (e assim que o Realtime identifica o tenant self-host). Em Compose
    # normal isto resolvia por causa do container_name; em Swarm o DNS do
    # overlay so resolve pelo nome do servico + aliases explicitos - por
    # isso o alias abaixo e obrigatorio, "hostname:" sozinho nao chega.
    #
    # Mantido em replicas=1: o Realtime espera-se correr como um unico no
    # (ou cluster Erlang configurado explicitamente); multiplas replicas
    # atras do mesmo alias sem clustering Erlang configurado podem causar
    # comportamento inconsistente nas subscricoes.
    hostname: realtime-dev.supabase-realtime
    image: supabase/realtime:v2.102.3
    networks:
      supabase_internal:
        aliases:
          - realtime-dev.supabase-realtime
    depends_on:
      - db
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${SUPABASE_NODE_HOSTNAME}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first

  storage:
    image: supabase/storage-api:v1.60.4
    networks:
      - supabase_internal
    depends_on:
      - db
      - rest
      - imgproxy
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID}
      REGION: ${REGION}
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    volumes:
      - ${SUPABASE_VOLUMES_PATH}/storage:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.hostname == ${SUPABASE_NODE_HOSTNAME}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first

  imgproxy:
    image: darthsim/imgproxy:v3.30.1
    networks:
      - supabase_internal
    volumes:
      - ${SUPABASE_VOLUMES_PATH}/storage:/var/lib/storage
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: ${IMGPROXY_AUTO_WEBP}
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.hostname == ${SUPABASE_NODE_HOSTNAME}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first

  meta:
    image: supabase/postgres-meta:v0.96.6
    networks:
      - supabase_internal
    depends_on:
      - db
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.hostname == ${SUPABASE_NODE_HOSTNAME}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first

  db:
    image: supabase/postgres:17.6.1.136
    networks:
      - supabase_internal
    volumes:
      - ${SUPABASE_VOLUMES_PATH}/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ${SUPABASE_VOLUMES_PATH}/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ${SUPABASE_VOLUMES_PATH}/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ${SUPABASE_VOLUMES_PATH}/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ${SUPABASE_VOLUMES_PATH}/db/data:/var/lib/postgresql/data
      - ${SUPABASE_VOLUMES_PATH}/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ${SUPABASE_VOLUMES_PATH}/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:ro
      - ${SUPABASE_VOLUMES_PATH}/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:ro
      - supabase_db_config:/etc/postgresql-custom
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      [
        "postgres",
        "-c", "config_file=/etc/postgresql/postgresql.conf",
        "-c", "log_min_messages=fatal"
      ]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${SUPABASE_NODE_HOSTNAME}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: pause

  supavisor:
    image: supabase/supavisor:2.9.5
    networks:
      - supabase_internal
    depends_on:
      - db
    volumes:
      - ${SUPABASE_VOLUMES_PATH}/pooler/pooler.exs:/etc/pooler/pooler.exs:ro
    environment:
      PORT: 4000
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
      CLUSTER_POSTGRES: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
      POOLER_TENANT_ID: ${POOLER_TENANT_ID}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN}
      POOLER_POOL_MODE: transaction
      DB_POOL_SIZE: ${POOLER_DB_POOL_SIZE}
    command:
      [
        "/bin/sh", "-c",
        "/app/bin/migrate && /app/bin/supavisor eval \"$$(cat /etc/pooler/pooler.exs)\" && /app/bin/server"
      ]
    # Mantido em replicas=1: pooler de conexoes com estado de sessao;
    # aumentar replicas exige testar o comportamento em modo "transaction"
    # com multiplas instancias antes de usar em producao.
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${SUPABASE_NODE_HOSTNAME}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
